name: carrossel-rico
version: 2
# Carrossel editorial estilo timesmkt3 (c0051, c0069...).
# Usa o worker carousel-designer (Playwright + template HTML).
#
# Defaults (se nada passado):
#   style:    "neon_futurista" (blue/green/gold cyberpunk)
#   formats:  ["1:1", "9:16", "16:9"]  — gera os 3 formatos canônicos
#   template: "editorial"
#   handle:   "@inema.tds"
#
# Input obrigatório:
#   slides: list — estrutura rica por slide
#
# Input opcional:
#   bg_prompts: list — prompts SD pra gerar backgrounds (1 por slide).
#                     Se vazio, slides usam só cor sólida do palette.
#   style: um dos 12 presets (neon_futurista, warm_lifestyle,
#          corporate_clean, bold_pop, minimal_zen, dark_cinematic,
#          pastel_soft, retro_vintage, nature_organic, urban_street,
#          luxury_gold, editorial_documentary).
#   palette: { primary, secondary, accent, background, text }
#            — override parcial sobre o style preset.
#   formats: ["1:1", "9:16", "16:9"] — subset pra gerar menos.
#   template: "editorial" (default, único disponível hoje)
#   image_model: "flux2-klein"
#
# Exemplo de `slides`:
#   - headline: "A dissonância que ninguém quer enxergar"
#     context: "Dos gestores que temem IA, só 39% temem pelo próprio cargo."
#     stat_a: { number: "70%", label: "Temem IA" }
#     stat_b: { number: "39%", label: "Temem pelo cargo" }
#     question: "Você consegue ver o problema? 🧠"
#     slide_label: "Dados · 2026"

stages:

  # Gera backgrounds (1 por slide) — só se bg_prompts vier preenchido.
  # Fanout sobre bg_prompts produz N imagens pro designer usar como bg.
  - id: backgrounds
    requires: image.generation
    when: $.input.bg_prompts != null
    fanout_over: $.input.bg_prompts
    payload_from:
      prompt: $.fanout_item
      model: $.input.image_model
      width: 1080
      height: 1080
    approval: {mode: none}

  # Designer: render HTML/CSS via Playwright.
  # Passa bg_prompts como lista vazia se skip — worker usa gradient puro.
  - id: carrossel
    requires: design.carousel_rich
    needs: [backgrounds]
    payload_from:
      slides: $.input.slides
      images: $.stages.backgrounds.output.outputs[*].image_url
      handle: $.input.handle
      # Se o user não passa style/palette/formats/template, o worker
      # aplica defaults: style=neon_futurista, formats=[1:1, 9:16, 16:9].
      style: $.input.style
      palette: $.input.palette
      formats: $.input.formats
      template: $.input.template
    approval: {mode: none}
