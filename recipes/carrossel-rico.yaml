name: carrossel-rico
version: 3
# Carrossel editorial estilo timesmkt3 (c0051, c0069...).
# Usa carousel-outline (gera slides a partir de texto livre) +
# carousel-designer (Playwright + template HTML).
#
# 2 modos de uso:
#
# 1) Texto livre (fácil):
#    input: { "topic": "Por que Claude Code muda a forma de programar" }
#    → stage outline gera slides estruturados.
#    → designer renderiza os 3 formatos (1:1, 9:16, 16:9).
#
# 2) Slides estruturados (controle total):
#    input: { "slides": [{ headline, context, stat_a, stat_b, ... }] }
#    → stage outline é pulado.
#    → designer recebe os slides prontos.
#
# Defaults quando não passa nada além do mínimo:
#   style:    "neon_futurista" (12 presets disponíveis)
#   formats:  ["1:1", "9:16", "16:9"] — gera os 3
#   template: "editorial"
#   handle:   "@inema.tds"
#   slide_count (modo 1): 5
#   slide_count (modo 2): 7
#   slide_count (modo 3): 10

stages:

  # Gera slides estruturados a partir de `topic` (só se user NÃO passou
  # `slides` direto E passou `topic`). Se nem um nem outro, pula e o
  # designer vai usar _slides_from_basic (title/captions/cta).
  - id: outline
    requires: design.carousel_outline
    when: $.input.slides == null && $.input.topic != null
    payload_from:
      topic: $.input.topic
      slide_count: $.input.slide_count
      language: $.input.language
      style: $.input.voice_style
      audience: $.input.audience
    approval: {mode: none}

  # Backgrounds opcionais (gera N imagens pra usar como bg dos slides).
  # Só roda se o user passou bg_prompts explicitamente.
  - id: backgrounds
    requires: image.generation
    when: $.input.bg_prompts != null
    fanout_over: $.input.bg_prompts
    payload_from:
      prompt: $.fanout_item
      model: $.input.image_model
      width: 1080
      height: 1080
    approval: {mode: none}

  # Designer: render HTML/CSS via Playwright.
  # Aceita slides do outline OU do input direto.
  - id: carrossel
    requires: design.carousel_rich
    needs: [outline, backgrounds]
    payload_from:
      # Se outline rodou, usa slides gerados. Senão, usa do input.
      slides_from_outline: $.stages.outline.output.slides
      slides_from_input: $.input.slides
      images: $.stages.backgrounds.output.outputs[*].image_url
      handle: $.input.handle
      style: $.input.style
      palette: $.input.palette
      formats: $.input.formats
      template: $.input.template
    approval: {mode: none}
