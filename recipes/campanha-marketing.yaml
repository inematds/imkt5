name: campanha-marketing
version: 6
# Pipeline completo: brief → copy → ad-designer → imagens (fanout) →
#                    voiceover → video (scene plan).
#
# TODO(auto-review): as aprovações via auto_reviewer estão como `none`
# enquanto amadurecemos os critérios e a estabilidade do revisor.
# Voltar stage-a-stage quando critérios forem objetivos e estáveis.

stages:

  # ─── Pesquisa: opt-in ────────────────────────────────────────────
  - id: research
    requires: research.market
    when: $.input.with_research == true
    payload_from:
      query: $.input.brief
    approval: {mode: none}

  # ─── Brief criativo ──────────────────────────────────────────────
  - id: brief
    requires: brief.strategic
    needs: [research]
    payload_from:
      brief: $.input.brief
      research: $.stages.research.output
    approval: {mode: none}

  # ─── Copy: 3 plataformas ─────────────────────────────────────────
  - id: copy
    requires: copy.platform
    needs: [brief]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      research: $.stages.research.output
    approval: {mode: none}

  # ─── Ad Design: gera 3 variantes com background_prompt p/ SD ─────
  # auto_reviewer ligado com critérios objetivos verificáveis.
  - id: ad_design
    requires: design.ad_layout
    needs: [copy]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      copy: $.stages.copy.output.copy
    approval:
      mode: auto_reviewer
      criteria:
        - "ad_design.variants tem exatamente 3 elementos"
        - "cada variante tem background_prompt não vazio"
      escalation: on_uncertain

  # ─── Imagens: fanout sobre variantes do ad-designer ──────────────
  - id: images
    requires: image.generation
    needs: [ad_design]
    fanout_over: $.stages.ad_design.output.ad_design.variants
    payload_from:
      prompt: $.fanout_item.background_prompt
      negative_prompt: $.fanout_item.negative_prompt
    approval: {mode: none}

  # ─── Voiceover: script curto do copy ─────────────────────────────
  - id: voiceover
    requires: audio.tts
    needs: [copy]
    payload_from:
      text: $.stages.copy.output.copy.key_benefit
      lang: "pt"
    approval: {mode: none}

  # ─── Video (scene plan) ──────────────────────────────────────────
  - id: video
    requires: video.cinematic
    needs: [ad_design, images, voiceover]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      copy: $.stages.copy.output.copy
      ads: $.stages.images.output.outputs[*].image_url
      voiceover_url: $.stages.voiceover.output.audio_url
    approval: {mode: none}
