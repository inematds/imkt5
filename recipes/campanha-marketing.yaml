name: campanha-marketing
version: 4
# Composição completa — derivada do pipeline do timesmkt3, multi-tenant.
# Política de aprovação: auto_reviewer por default. Humano só quando
# o usuário passar with_user_approval: true no input.

stages:

  # ─── Pesquisa: opt-in ────────────────────────────────────────────
  - id: research
    requires: research.market
    when: $.input.with_research == true
    payload_from:
      brief: $.input.brief
    approval: {mode: none}

  # ─── Brief criativo: auto-review ──────────────────────────────────
  - id: brief
    requires: brief.strategic
    needs: [research]
    payload_from:
      brief: $.input.brief
      research: $.stages.research.output
    approval:
      mode: auto_reviewer
      criteria:
        - "brief tem ângulo estratégico claro"
        - "brief define público-alvo"
        - "brief define CTA"
      escalation: on_uncertain

  # ─── Copy: auto-review por default (ver doc/approval-policy.md) ──
  - id: copy
    requires: copy.narrative
    needs: [brief]
    payload_from:
      brief: $.stages.brief.output
    approval:
      mode: auto_reviewer
      criteria:
        - "texto está em português"
        - "tem hook claro nos primeiros 10s"
        - "tem CTA explícito"
        - "alinhado com brand do tenant"
        - "não usa claims médicos sem disclaimer"
      escalation: on_uncertain

  # ─── Imagens: sem aprovação (trivial) ─────────────────────────────
  - id: images
    requires: image.generation
    needs: [copy]
    parallel: 6
    payload_from:
      prompts: $.stages.copy.output.prompts
      style: $.tenant.profile.visual_style
    approval: {mode: none}

  # ─── Voiceover: sem aprovação ─────────────────────────────────────
  - id: voiceover
    requires: audio.tts
    needs: [copy]
    payload_from:
      text: $.stages.copy.output.voiceover_script
      voice_id: $.tenant.profile.voice_id
    approval: {mode: none}

  # ─── Ads: auto-review (composição visual) ─────────────────────────
  - id: ads
    requires: design.static_ad
    needs: [images]
    payload_from:
      images: $.stages.images.output.outputs[*].image_url
      narrative: $.stages.copy.output
    approval:
      mode: auto_reviewer
      criteria:
        - "composição visual balanceada"
        - "texto overlay legível em todas resoluções"
        - "respeita paleta da marca"
      escalation: on_uncertain

  # ─── Video: auto-review ───────────────────────────────────────────
  - id: video
    requires: video.cinematic
    needs: [ads, voiceover]
    payload_from:
      images: $.stages.ads.output.image_urls
      audio: $.stages.voiceover.output.audio_url
    approval:
      mode: auto_reviewer
      criteria:
        - "áudio sincronizado"
        - "abertura captura atenção em 2s"
        - "CTA final claro"
      escalation: on_uncertain

  # ─── Otimização por plataforma (DIFERIDA) ─────────────────────────
  # Os 6 workers platform-* estão adiados — ver doc/deferred-platform-workers.md.
  # Quando forem portados, descomentar:
  #
  # - id: platforms
  #   fanout_over_capabilities:
  #     - platform.instagram
  #     - platform.youtube
  #     - platform.tiktok
  #     - platform.facebook
  #     - platform.threads
  #     - platform.linkedin
  #   needs: [video]
  #   payload_from:
  #     video: $.stages.video.output
  #     narrative: $.stages.copy.output
  #   approval: {mode: user}

  # Sem stage "distribute" — publicação é ação do painel Web, não job.
