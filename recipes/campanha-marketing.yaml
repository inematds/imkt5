name: campanha-marketing
version: 7
# Pipeline completo: brief → copy → ad-designer → imagens (fanout) →
#                    voiceover → video (scene plan) → video_render (MP4).
#
# Input da run — tudo opcional exceto `brief`. Workers têm defaults.
#   brief                   string    (obrigatório)
#   with_research           bool      (default false)
#   language                string    (default "pt-BR")
#   platform_targets        string[]  (default instagram,youtube,threads)
#   image_count             int       (default 3)
#   image_model             string    (default env OLLAMA/flux2-klein)
#   image_formats           string[]  (default feed,stories,yt_thumb)
#   image_reference         string    url de imagem-ref pra qwen-edit
#   image_reference_note    string    instrução pro background_prompt
#   image_background_color  string    hex
#   video_mode              string    quick|pro|skip   (default quick)
#   video_template          string    (default auto)
#   video_audio             string    narration|none   (default narration)
#   use_brand_overlay       bool      (default false)
#   tts_provider            string    edge|elevenlabs  (default edge)
#   skip_image              bool      (default false)
#   skip_video              bool      (default false)
#   notifications           bool      (default true)

stages:

  - id: research
    requires: research.market
    when: $.input.with_research == true
    payload_from:
      query: $.input.brief
    approval: {mode: none}

  - id: brief
    requires: brief.strategic
    needs: [research]
    payload_from:
      brief: $.input.brief
      research: $.stages.research.output
      language: $.input.language
      platform_targets: $.input.platform_targets
      image_reference_note: $.input.image_reference_note
    approval: {mode: none}

  - id: copy
    requires: copy.platform
    needs: [brief]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      research: $.stages.research.output
      language: $.input.language
      platform_targets: $.input.platform_targets
    approval: {mode: none}

  - id: ad_design
    requires: design.ad_layout
    needs: [copy]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      copy: $.stages.copy.output.copy
      image_count: $.input.image_count
      image_formats: $.input.image_formats
      image_reference_note: $.input.image_reference_note
      image_background_color: $.input.image_background_color
      platform_targets: $.input.platform_targets
      language: $.input.language
    # TODO(10b no backlog): reativar auto_reviewer após endurecer critérios.
    # Enquanto flutuar, rodar sem gate pra não bloquear.
    approval: {mode: none}

  - id: images
    requires: image.generation
    needs: [ad_design]
    when: $.input.skip_image != true
    fanout_over: $.stages.ad_design.output.ad_design.variants
    payload_from:
      prompt: $.fanout_item.background_prompt
      negative_prompt: $.fanout_item.negative_prompt
      model: $.input.image_model
      images: $.input.image_reference
    approval: {mode: none}

  # Video scene plan. Usa a capability `video.cinematic` — com video-quick
  # registrado, ou video-pro com alias. Pra trocar pra pro, mude a
  # capability aqui pra `video.cinematic_pro` (ou reordene workers.yaml).
  - id: video
    requires: video.cinematic
    needs: [ad_design, images]
    when: $.input.skip_video != true
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      copy: $.stages.copy.output.copy
      ads: $.stages.images.output.outputs[*].image_url
      language: $.input.language
      video_template: $.input.video_template
    approval: {mode: none}

  - id: voiceover
    requires: audio.tts
    needs: [video]
    when: $.input.skip_video != true && $.input.video_audio != "none"
    payload_from:
      text: $.stages.video.output.scene_plan.full_narration
      lang: $.input.language
      engine: $.input.tts_provider
    approval: {mode: none}

  - id: video_render
    requires: video.render
    needs: [video, voiceover]
    when: $.input.skip_video != true
    payload_from:
      scene_plan: $.stages.video.output.scene_plan
      narration_url: $.stages.voiceover.output.audio_url
      use_brand_overlay: $.input.use_brand_overlay
      tenant_id: $.tenant.tenant_id
    approval: {mode: none}
