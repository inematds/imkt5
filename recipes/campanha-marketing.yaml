name: campanha-marketing
version: 11
# Pipeline completo: brief → copy → ad-designer → imagens (fanout) →
#                    voiceover → video (scene plan) → video_render (MP4).
#
# Input da run — tudo opcional exceto `brief`. Workers têm defaults.
#   brief                   string    (obrigatório)
#   with_research           bool      (default false)
#   language                string    (default "pt-BR")
#   platform_targets        string[]  (default instagram,youtube,threads)
#   image_count             int       (default 3)
#   image_model             string    (default env OLLAMA/flux2-klein)
#   image_formats           string[]  (default feed,stories,yt_thumb)
#   image_reference         string    url de imagem-ref pra qwen-edit
#   image_reference_note    string    instrução pro background_prompt
#   image_background_color  string    hex
#   video_mode              string    quick|pro|skip   (default quick)
#   video_template          string    (default auto)
#   video_audio             string    narration|none   (default narration)
#   use_brand_overlay       bool      (default false)
#   tts_provider            string    edge|elevenlabs  (default edge)
#   skip_image              bool      (default false)
#   skip_video              bool      (default false)
#   notifications           bool      (default true)

stages:

  - id: research
    requires: research.market
    when: $.input.with_research == true
    payload_from:
      query: $.input.brief
    approval: {mode: none}

  # Item 7 — brief_strategic tem gate opcional (bifurcação: direção ruim
  # é caríssima pra descobrir no fim). Default: none. Ativar via
  # `approval_mode: "human"` (ou "auto") no input da run.
  - id: brief
    requires: brief.strategic
    needs: [research]
    payload_from:
      brief: $.input.brief
      research: $.stages.research.output
      language: $.input.language
      platform_targets: $.input.platform_targets
      image_reference_note: $.input.image_reference_note
    approval: {mode: none}

  # Video art direction ANTES do copy/ad_design — define style, motion,
  # hook pattern e música logo no início pra que o copy e os bg_prompts
  # fiquem alinhados ao style visual escolhido. Roda a menos que user
  # passou style/template explícitos OU video foi skipped (skip_video).
  - id: video_art_direction
    requires: video.art_direction
    needs: [brief]
    when: $.input.video_style == null && $.input.skip_video != true
    payload_from:
      brief: $.input.brief
      creative_brief: $.stages.brief.output.creative_brief
      audience: $.input.audience
      platform: $.input.platform
      brand_profile: $.tenant.profile
    approval: {mode: none}

  - id: copy
    requires: copy.platform
    needs: [brief, video_art_direction]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      research: $.stages.research.output
      language: $.input.language
      platform_targets: $.input.platform_targets
      # Informa style pra copywriter alinhar tom/palavras ao mood
      art_direction_style: $.stages.video_art_direction.output.style
      art_direction_hook_pattern: $.stages.video_art_direction.output.hook_pattern
    approval: {mode: none}

  - id: ad_design
    requires: design.ad_layout
    needs: [copy]
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      copy: $.stages.copy.output.copy
      image_count: $.input.image_count
      image_formats: $.input.image_formats
      image_reference_note: $.input.image_reference_note
      image_background_color: $.input.image_background_color
      platform_targets: $.input.platform_targets
      language: $.input.language
      # bg_prompts alinhados ao style do video (fotografia, mood, cor)
      art_direction_style: $.stages.video_art_direction.output.style
    approval: {mode: none}

  - id: images
    requires: image.generation
    needs: [ad_design]
    when: $.input.skip_image != true
    fanout_over: $.stages.ad_design.output.ad_design.variants
    payload_from:
      prompt: $.fanout_item.background_prompt
      negative_prompt: $.fanout_item.negative_prompt
      model: $.input.image_model
      images: $.input.image_reference
    approval: {mode: none}

  # Video scene plan. Já recebe direção de arte (roda desde o início).
  # Item 7 — stage de maior leverage pra aprovação: cena ruim vale caro pra
  # render. Default none; promove via approval_mode global.
  - id: video
    requires: video.cinematic
    needs: [ad_design, images, video_art_direction]
    when: $.input.skip_video != true
    payload_from:
      creative_brief: $.stages.brief.output.creative_brief
      copy: $.stages.copy.output.copy
      ads: $.stages.images.output.outputs[*].image_url
      language: $.input.language
      video_template: $.input.video_template
      # Art direction: hook pattern + style guiam o LLM planner
      art_direction_style: $.stages.video_art_direction.output.style
      art_direction_motion: $.stages.video_art_direction.output.motion_preset
      art_direction_transition: $.stages.video_art_direction.output.transition
      art_direction_hook_pattern: $.stages.video_art_direction.output.hook_pattern
    approval: {mode: none}

  # TTS por cena (mkt3-style): fanout sobre scenes → 1 mp3 por cena.
  # ffmpeg-local mede duração de cada e sincroniza scene.duration com audio.
  # Dedup (sha256) no inemavox-adapter evita regerar narrações idênticas
  # entre runs similares (economia 40-60%).
  - id: voiceover
    requires: audio.tts
    needs: [video]
    when: $.input.skip_video != true && $.input.video_audio != "none"
    fanout_over: $.stages.video.output.scene_plan.scenes
    payload_from:
      text: $.fanout_item.narration
      lang: $.input.language
      engine: $.input.tts_provider
      speed: $.input.narration_speed
    approval: {mode: none}

  # c79 fase α-bis — pré-renderiza texto de cena como PNG RGBA (chrome
  # gradient + halo Instrument Serif italic). Opt-in via chrome_text_overlay=true.
  # Skippa se flag off.
  - id: text_overlays
    requires: video.text_overlay
    needs: [video]
    when: $.input.chrome_text_overlay == true && $.input.skip_video != true
    payload_from:
      scenes: $.stages.video.output.scene_plan.scenes
      width: $.stages.video.output.scene_plan.width
      height: $.stages.video.output.scene_plan.height
      tenant_id: $.tenant.tenant_id
      # text_overlay_style: chrome_overlay (default) | chrome_fullslide |
      #   magazine_bar | solid_block | stamp_diagonal | kinetic_pop | minimal_caption
      text_overlay_style: $.input.text_overlay_style
      mode: $.input.chrome_text_mode
      brand_logo: $.input.brand_logo
      brand_tag: $.input.brand_tag
      brand_handle: $.input.brand_handle
      # Cores custom para solid_block / stamp / kinetic
      block_color: $.input.block_color
      block_text_color: $.input.block_text_color
      stamp_color: $.input.stamp_color
      pop_color: $.input.pop_color
    approval: {mode: none}

  - id: video_render
    requires: video.render
    needs: [video, voiceover, video_art_direction, text_overlays]
    when: $.input.skip_video != true
    payload_from:
      scene_plan: $.stages.video.output.scene_plan
      narration_urls: $.stages.voiceover.output.outputs[*].audio_url
      use_brand_overlay: $.input.use_brand_overlay
      tenant_id: $.tenant.tenant_id
      # Repassa direção de arte pro renderer (música, SFX, hook, transição)
      style: $.stages.video_art_direction.output.style
      music_genre: $.stages.video_art_direction.output.music_genre
      hook_pattern: $.stages.video_art_direction.output.hook_pattern
      transition: $.stages.video_art_direction.output.transition
      use_sfx: $.input.use_sfx
      use_karaoke: $.input.use_karaoke
      # Fase 2: video_mode="pro" ativa crossfade + color grading.
      video_mode: $.input.video_mode
      use_crossfade: $.input.use_crossfade
      use_color_grading: $.input.use_color_grading
      # v4: narration_speed (atempo), hold_final, loop_visual, kinetic_presets,
      # freeze_frames, use_parallax, depth_ai — todos opt-in via input
      narration_speed: $.input.narration_speed
      hold_final: $.input.hold_final
      loop_visual: $.input.loop_visual
      kinetic_presets: $.input.kinetic_presets
      freeze_frames: $.input.freeze_frames
      use_parallax: $.input.use_parallax
      depth_ai: $.input.depth_ai
      # Item 12b — safe zone específica da plataforma alvo (tiktok,
      # instagram_reels, shorts, etc). Opt-in via input.platform.
      platform: $.input.platform
      # c79 fase α-bis: flag + URLs dos PNGs pré-renderizados
      chrome_text_overlay: $.input.chrome_text_overlay
      text_overlay_urls: $.stages.text_overlays.output.outputs[*].text_png_url
      # Outras flags c79 fase α (já existentes)
      hold_final_s: $.input.hold_final_s
      pacing: $.input.pacing
    approval: {mode: none}
