name: simple-carrossel
version: 3
# Carrossel mínimo: gera N imagens coesas com mesmo prompt + compõe
# texto (título/captions/CTA) sobre elas estilo IG.
#
# Input:
#   prompt      string  — descrição da imagem base
#   count       int     — número de slides (default 2)
#   model       string  — modelo SD (default flux2-klein)
#   title       string  — texto no slide 1
#   captions    list    — texto dos slides intermediários
#   cta         string  — texto no último slide

stages:
  - id: images
    requires: image.generation
    parallel: 2
    payload_from:
      prompt: $.input.prompt
      model: $.input.model
      width: 1080
      height: 1080
      steps: 15
    approval: {mode: none}

  - id: carrossel
    requires: design.carousel
    needs: [images]
    payload_from:
      images: $.stages.images.output.outputs[*].image_url
      title: $.input.title
      captions: $.input.captions
      cta: $.input.cta
    approval: {mode: none}
