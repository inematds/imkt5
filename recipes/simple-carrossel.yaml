name: simple-carrossel
version: 2
# Exemplo de receita pequena: gerar imagens coesas + monta carrossel.
# parallel: 2 é realista pra dev local com 1 GPU.

stages:
  - id: images
    requires: image.generation
    parallel: 2
    payload_from:
      prompt: $.input.prompt   # mesmo prompt nas N imagens
      model: $.input.model
      width: 512
      height: 512
      steps: 15
    approval: {mode: none}

  - id: carrossel
    requires: design.carousel
    needs: [images]
    payload_from:
      images: $.stages.images.output.outputs[*].image_url
      title: $.input.title
    approval: {mode: none}
