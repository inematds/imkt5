# Fonte única de defaults operacionais do imkt5.
#
# Regra de precedência: env var → este arquivo → fallback no código.
# Chave-valor: cada valor tem um env var que pode sobrescrever.
#
# Docs: doc/defaults.md

gateway:
  host: 0.0.0.0        # env: GATEWAY_HOST
  port: 8080           # env: GATEWAY_PORT

dispatcher:
  # HttpDispatcher — ponte entre gateway e workers via HTTP
  request_timeout_seconds: 1200         # env: IMKT5_DISPATCH_TIMEOUT (20min — renders educativos longos)
  retry_when_saturated_seconds: 2.0     # espera 2s entre tentativas de seleção
  max_pending_jobs: 1000
  # 2s × 1800 = 3600s = 1h. Suficiente pra 2 renders longos enfileirados.
  max_select_retries: 1800

capability_registry:
  probe_timeout_seconds: 3.0            # env: IMKT5_PROBE_TIMEOUT
  default_worker_priority: 50
  default_worker_max_concurrent: 4
  default_worker_timeout_seconds: 120

jobs_store:
  max_history: 500                       # env: IMKT5_JOBS_HISTORY
  # Se POSTGRES_URL setado, usa PostgresJobsStore (persistente);
  # senão, in-memory (perde no restart).

approvals:
  default_timeout_seconds: 1800          # 30 min; env: IMKT5_APPROVAL_TIMEOUT

storage:
  artifact_root: ./data/artifacts        # env: IMKT5_ARTIFACT_ROOT

memory:
  db_path: ./data/memory.db              # env: MEMORY_DB_PATH

llm:
  openrouter:
    base_url: https://openrouter.ai/api/v1      # env: OPENROUTER_BASE_URL
    default_model: google/gemini-2.0-flash-exp:free  # env: OPENROUTER_MODEL_DEFAULT
  ollama:
    url: http://localhost:11434                 # env: OLLAMA_URL
    chat_model: qwen3.5:35b-a3b                 # env: OLLAMA_MODEL
    router_model: qwen2.5:14b                   # env: OLLAMA_ROUTER_MODEL

# Workers — cada um tem seu default de port e parâmetros específicos.
# Overrides via env: <UPPER_NAME>_* (ex.: INEMAIMG_URL, RESEARCH_PORT)
workers:

  research:
    port: 8100                           # env: RESEARCH_PORT

  auto_reviewer:
    port: 8200                           # env: AUTO_REVIEWER_PORT

  inemaimg_adapter:
    port: 8020                           # env: IMKT5_INEMAIMG_ADAPTER_PORT
    upstream_url: http://localhost:8000  # env: INEMAIMG_URL
    default_model: qwen-edit-2511        # env: INEMAIMG_MODEL
    request_timeout_seconds: 180         # env: INEMAIMG_TIMEOUT

  inemavox_adapter:
    port: 8021                           # env: IMKT5_INEMAVOX_ADAPTER_PORT
    upstream_url: http://localhost:8010  # env: INEMAVOX_URL
    poll_interval_seconds: 1.5           # env: INEMAVOX_POLL_INTERVAL
    poll_max_seconds: 600                # env: INEMAVOX_POLL_MAX_SECONDS

# Payload defaults por capability — usados pela UI quando usuário entra
# texto livre. Também servem como sugestão para clientes HTTP.
capability_payload_defaults:

  image.generation:
    model: flux2-klein
    steps: 15
    width: 512
    height: 512

  audio.tts:
    engine: edge
    lang: pt

  audio.dubbing:
    engine: chatterbox
    lang: pt

  audio.transcribe:
    format: srt

  research.market:
    max_results_per_query: 3
    depth: basic

  review.auto:
    default_criteria:
      - "o texto está em português"
      - "o texto tem pelo menos 20 caracteres"
