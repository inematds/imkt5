# Catálogo de workers registrados no Gateway. Local-first.
# O Gateway carrega este arquivo no boot e faz health-check periódico.
#
# Regras:
#  - `local: true` ganha tie-break sobre `local: false`.
#  - Dentro do mesmo `local`, priority maior vence.
#  - Worker "DOWN" no último health-check é pulado; cai pro próximo.
#  - Providers são workers como qualquer outro — não há categoria
#    especial "provider" no código.

workers:

  # ── image.generation ──────────────────────────────────────────────
  # stable-diffusion-local (porta 7860) — comentado até existir um
  # adapter próprio em workers/sd-adapter/. O servidor SD não fala o
  # contrato BaseWorker (/execute), responde /health da própria webui
  # e isso fazia o matcher escolher errado.
  # - name: stable-diffusion-local
  #   capabilities: [image.generation]
  #   endpoint: http://localhost:7860
  #   local: true
  #   priority: 100
  #   max_concurrent: 1

  # inemaimg serializa internamente (asyncio.Lock na GPU). max_concurrent: 1.
  # Para paralelismo real, registrar múltiplas instâncias em portas/máquinas
  # distintas (ex.: inemaimg-gpu0, inemaimg-gpu1) — o matcher distribui.
  - name: inemaimg
    # inemaimg só gera imagens; design.static_ad e design.carousel
    # exigem composição (HTML→PNG via Playwright, ou ffmpeg) — workers
    # próprios em fases futuras.
    capabilities: [image.generation]
    endpoint: http://localhost:8020   # adapter (não confundir com upstream em :8000)
    local: true
    priority: 90
    timeout_seconds: 180
    max_concurrent: 1

  # kie e pollinations: comentados até ter adapter próprio.
  # Estes serviços não falam /execute (BaseWorker contract). Quando
  # criarmos workers/kie-adapter/ e workers/pollinations-adapter/,
  # apontar `endpoint` pra eles em vez de pra API direta.
  # - name: kie
  #   capabilities: [image.generation]
  #   endpoint: https://api.kie.ai
  #   local: false
  #   priority: 30
  # - name: pollinations
  #   capabilities: [image.generation]
  #   endpoint: https://image.pollinations.ai
  #   local: false
  #   priority: 10

  # ── audio.tts ─────────────────────────────────────────────────────
  # - name: coqui-local
  # capabilities: [audio.tts]
  # endpoint: http://localhost:5002
  # local: true
  # priority: 100
  # max_concurrent: 2

  # # inemavox tem fila interna mas processa 1 por vez (1 _worker_task no asyncio.Queue).
  # # Mesmo padrão: para paralelismo, escalar instâncias.
  - name: inemavox
    capabilities: [audio.tts, audio.dubbing, audio.transcribe]
    endpoint: http://localhost:8021   # adapter (upstream inemavox roda em :8010)
    local: true
    priority: 90
    timeout_seconds: 600
    max_concurrent: 1

  # - name: elevenlabs
  # capabilities: [audio.tts]
  # endpoint: https://api.elevenlabs.io
  # local: false
  # priority: 20

  # # ── video.render ──────────────────────────────────────────────────
  # - name: ffmpeg-local
  # capabilities: [video.slideshow, video.render]
  # endpoint: http://localhost:8020
  # local: true
  # priority: 100

  # - name: remotion-local
  # capabilities: [video.cinematic, video.render]
  # endpoint: http://localhost:8021
  # local: true
  # priority: 90

  # # ── workers "cérebro" (prompt-based, Claude subprocess) ──────────
  - name: research
    capabilities: [research.market, research.tavily]
    endpoint: http://localhost:8100
    local: true
    priority: 50

  - name: creative-brief
    capabilities: [brief.strategic]
    endpoint: http://localhost:8101
    local: true
    priority: 50
    timeout_seconds: 120
    max_concurrent: 2

  - name: copywriter
    capabilities: [copy.platform]
    endpoint: http://localhost:8102
    local: true
    priority: 50
    timeout_seconds: 120
    max_concurrent: 2

  - name: ad-designer
    capabilities: [design.ad_layout]
    endpoint: http://localhost:8103
    local: true
    priority: 50
    timeout_seconds: 180
    max_concurrent: 2

  # video-quick — planner (não renderiza). `video.cinematic` é alias
  # temporário até portarmos video-pro próprio.
  - name: video-quick
    capabilities: [video.plan, video.cinematic]
    endpoint: http://localhost:8104
    local: true
    priority: 50
    timeout_seconds: 120
    max_concurrent: 2

  # ffmpeg-local — renderer (H.264/AAC, zoompan motion, drawtext overlay)
  - name: ffmpeg-local
    capabilities: [video.render]
    endpoint: http://localhost:8105
    local: true
    priority: 100
    timeout_seconds: 600
    max_concurrent: 1

  # video-pro — cinematic, 8-12 cenas, 45-90s, estrutura narrativa
  - name: video-pro
    capabilities: [video.cinematic_pro]
    endpoint: http://localhost:8106
    local: true
    priority: 50
    timeout_seconds: 180
    max_concurrent: 2

  # # ── aprovação automática ─────────────────────────────────────────
  - name: auto-reviewer
    capabilities: [review.auto]
    endpoint: http://localhost:8200
    local: true
    priority: 100

  # ── yt / tiktok (portados de yt-pub-lives) ───────────────────────
  - name: yt-source-ingest
    capabilities: [video.source_ingest]
    endpoint: http://localhost:8300
    local: true
    priority: 100
    timeout_seconds: 60
    max_concurrent: 4

  - name: yt-clip
    capabilities: [video.clip_extraction]
    endpoint: http://localhost:8301
    local: true
    priority: 100
    timeout_seconds: 900
    max_concurrent: 1

  - name: yt-publish
    capabilities: [video.publish, platform.youtube]
    endpoint: http://localhost:8302
    local: true
    priority: 100
    timeout_seconds: 900
    max_concurrent: 1

  # tiktok-ingest: tem mesmo capability do yt-source-ingest; prioridade
  # 90 (menor) — só ganha quando source.external_id é @handle tiktok;
  # yt-source-ingest com channel UC... é filtrado no worker.
  - name: tiktok-ingest
    capabilities: [video.source_ingest]
    endpoint: http://localhost:8303
    local: true
    priority: 90
    timeout_seconds: 60
    max_concurrent: 4

  # carousel-composer — MVP. Recebe lista de URLs e devolve JSON
  # descritivo do carrossel (sem rendering de composição).
  - name: carousel-composer
    capabilities: [design.carousel]
    endpoint: http://localhost:8107
    local: true
    priority: 50
    timeout_seconds: 30
    max_concurrent: 4

  # education-outline — roteirista pedagógico (hook → conteúdo → CTA).
  - name: education-outline
    capabilities: [education.outline]
    endpoint: http://localhost:8108
    local: true
    priority: 50
    timeout_seconds: 180
    max_concurrent: 2

  # outline-to-video-plan — converte outline educativo em scene_plan
  # compatível com ffmpeg-local (video.render).
  - name: outline-to-video-plan
    capabilities: [video.plan_from_outline]
    endpoint: http://localhost:8109
    local: true
    priority: 50
    timeout_seconds: 30
    max_concurrent: 4

  # photography-director — linguagem visual completa (style preset,
  # palette, tipografia, câmera, transições). Chamado sob demanda
  # por receitas que pedem design.photo_direction.
  - name: photography-director
    capabilities: [design.photo_direction]
    endpoint: http://localhost:8110
    local: true
    priority: 50
    timeout_seconds: 120
    max_concurrent: 2

  # carousel-designer — render rico via Playwright/Chromium (estilo
  # editorial do timesmkt3). Responde tanto `design.carousel_rich`
  # quanto `design.carousel` (prioridade alta — vence o composer
  # Pillow quando healthy; composer fica de fallback automático).
  - name: carousel-designer
    capabilities: [design.carousel_rich, design.carousel]
    endpoint: http://localhost:8111
    local: true
    priority: 80
    timeout_seconds: 180
    max_concurrent: 1

  # carousel-outline — gera slides estruturados a partir de texto livre.
  # Consumido pela receita carrossel-rico quando input não traz slides.
  - name: carousel-outline
    capabilities: [design.carousel_outline]
    endpoint: http://localhost:8112
    local: true
    priority: 50
    timeout_seconds: 120
    max_concurrent: 2

  # art-director — escolhe template visual + palette pro carousel-designer
  # a partir do brief + perfil da marca + audiência + plataforma.
  - name: art-director
    capabilities: [design.art_director]
    endpoint: http://localhost:8113
    local: true
    priority: 50
    timeout_seconds: 60
    max_concurrent: 2

  # video-art-director — escolhe style+motion+transition+music+hook pro
  # video-quick/video-pro. Catálogo dos 12 styles canônicos do mkt3.
  - name: video-art-director
    capabilities: [video.art_direction]
    endpoint: http://localhost:8114
    local: true
    priority: 50
    timeout_seconds: 60
    max_concurrent: 2

  # video-ab-suggest — Item 6c: LLM sugere hook_variants/cta_variants/
  # combinations pra auto-popular campanha-marketing-ab quando user passa
  # flag `ab_ai_suggest: true`.
  - name: video-ab-suggest
    capabilities: [video.ab_suggest]
    endpoint: http://localhost:8115
    local: true
    priority: 50
    timeout_seconds: 60
    max_concurrent: 2

