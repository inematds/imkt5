<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width={{ width }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    background: {{ palette.background }};
    font-family: 'Inter', 'Playfair Display', sans-serif;
    position: relative;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.42) saturate(1.1) contrast(1.08);
    z-index: 0;
  }

  .overlay {
    position: absolute; inset: 0; z-index: 1;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 85%),
      linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 100%);
  }

  .container {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: {{ pad_v }}px {{ pad_h }}px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .edition {
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.24em; text-transform: uppercase;
  }
  .slide-num {
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 400; font-style: italic;
    color: rgba(255,255,255,0.45);
  }

  .main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 0;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: rgba(255,255,255,0.97);
    line-height: 1.05;
    letter-spacing: -0.015em;
    text-align: center;
    text-shadow: 0 4px 32px rgba(0,0,0,0.5);
    font-size: {{ headline_size }}px;
    max-width: 90%;
  }
  .headline::before, .headline::after {
    content: "";
    display: block;
    width: 60px; height: 2px;
    background: {{ palette.accent }};
    margin: 28px auto;
    opacity: 0.8;
  }
  .headline::after { margin-bottom: 0; }

  .bottom-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'Inter', sans-serif;
  }
  .handle {
    font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em;
  }
  .caption {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 16px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  {% if bg_image %}<img class="bg-image" src="{{ bg_image }}" alt="">{% endif %}
  <div class="overlay"></div>
  <div class="container">
    <div class="top-bar">
      <div class="edition">{{ badge or "INEMA" }}</div>
      <div class="slide-num">№ {{ slide_num }}</div>
    </div>
    <div class="main">
      <div class="headline">{{ headline }}</div>
    </div>
    <div class="bottom-bar">
      <div class="caption">{{ slide_label or "" }}</div>
      <div class="handle">{{ handle or "@inema.tds" }}</div>
    </div>
  </div>
</body>
</html>
