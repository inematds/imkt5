<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: {{ width }}px; height: {{ height }}px; overflow: hidden;
    background: {{ palette.background }};
    font-family: 'Jost', sans-serif;
    color: {{ palette.text }};
    position: relative;
  }
  {% if bg_image %}
  .bg-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(1.05) saturate(0.75) contrast(0.95);
    opacity: 0.35;
    z-index: 0;
  }
  .bg-veil {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg,
      {{ palette.background }}e0 0%, {{ palette.background }}80 40%,
      {{ palette.background }}e8 100%);
  }
  {% endif %}
  .container {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: {{ (pad_v * 1.2) | int }}px {{ (pad_h * 1.3) | int }}px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top {
    text-align: center;
    font-size: 11px; font-weight: 400; letter-spacing: 0.45em;
    text-transform: uppercase; color: {{ palette.text }}88;
  }
  .main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 32px;
    text-align: center;
  }
  .ornament {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; color: {{ palette.accent }};
    font-style: italic; letter-spacing: 0.2em;
    opacity: 0.7;
  }
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300; font-style: italic;
    font-size: {{ (headline_size * 1.1) | int }}px;
    line-height: 1.18; color: {{ palette.text }};
    letter-spacing: 0.01em;
    max-width: 82%;
    text-transform: none;
  }
  .divider {
    width: 48px; height: 1px; background: {{ palette.accent }};
    opacity: 0.45;
  }
  .context {
    font-family: 'Jost', sans-serif; font-weight: 300;
    font-size: {{ (headline_size * 0.28) | int }}px;
    line-height: 1.55; color: {{ palette.text }}aa;
    max-width: 70%; letter-spacing: 0.02em;
  }
  .bottom {
    text-align: center;
    font-family: 'Jost', sans-serif; font-weight: 300;
    font-size: 12px; letter-spacing: 0.3em;
    text-transform: uppercase; color: {{ palette.text }}66;
  }
</style>
</head>
<body>
  {% if bg_image %}<img class="bg-image" src="{{ bg_image }}" alt="">{% endif %}
  {% if bg_image %}<div class="bg-veil"></div>{% endif %}
  <div class="container">
    <div class="top">{{ badge or "inema" }} · {{ slide_num }}</div>
    <div class="main">
      <div class="ornament">~</div>
      <div class="headline">{{ headline }}</div>
      <div class="divider"></div>
      {% if context %}<div class="context">{{ context }}</div>{% endif %}
    </div>
    <div class="bottom">{{ handle or "@inema.tds" }}</div>
  </div>
</body>
</html>
