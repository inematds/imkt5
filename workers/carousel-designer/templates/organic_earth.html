<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Nunito:wght@400;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: {{ width }}px; height: {{ height }}px; overflow: hidden;
    background: {{ palette.background }};
    font-family: 'Nunito', sans-serif;
    color: {{ palette.text }};
    position: relative;
  }
  /* paper texture via subtle radial gradient layers */
  .paper {
    position: absolute; inset: 0; z-index: 1;
    background:
      radial-gradient(circle at 20% 30%, {{ palette.accent }}15 0%, transparent 55%),
      radial-gradient(circle at 80% 70%, {{ palette.primary }}15 0%, transparent 60%),
      repeating-linear-gradient(0deg,
        transparent 0, transparent 2px,
        {{ palette.text }}04 2px, {{ palette.text }}04 3px);
    pointer-events: none;
  }
  /* organic blob shape */
  .blob {
    position: absolute; z-index: 1;
    width: 40%; aspect-ratio: 1;
    top: -10%; right: -8%;
    background: {{ palette.primary }};
    border-radius: 63% 37% 45% 55% / 50% 42% 58% 50%;
    opacity: 0.2;
  }
  .blob-2 {
    position: absolute; z-index: 1;
    width: 30%; aspect-ratio: 1;
    bottom: -8%; left: -6%;
    background: {{ palette.secondary }};
    border-radius: 51% 49% 70% 30% / 32% 58% 42% 68%;
    opacity: 0.18;
  }
  {% if bg_image %}
  .bg-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    filter: sepia(0.25) saturate(0.85) brightness(1.1);
    opacity: 0.28; z-index: 0;
  }
  {% endif %}
  .container {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: {{ (pad_v * 1.1) | int }}px {{ (pad_h * 1.1) | int }}px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: {{ palette.accent }}; font-weight: 600;
  }
  .top .num { font-family: 'Fraunces', serif; font-style: italic;
              font-size: 18px; color: {{ palette.text }}80;
              text-transform: none; letter-spacing: 0; }
  .main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; gap: 22px;
  }
  .headline {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: {{ headline_size }}px;
    line-height: 1.1; letter-spacing: -0.01em;
    color: {{ palette.text }};
    max-width: 92%;
  }
  .underline {
    width: 120px; height: 3px;
    background: {{ palette.primary }};
    border-radius: 2px;
  }
  .context {
    font-family: 'Nunito', sans-serif; font-weight: 400;
    font-size: {{ (headline_size * 0.32) | int }}px;
    line-height: 1.5; color: {{ palette.text }}cc;
    max-width: 82%;
  }
  .signature {
    font-family: 'Caveat', cursive;
    font-size: 24px; color: {{ palette.primary }};
    margin-top: 8px;
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .handle {
    font-family: 'Caveat', cursive; font-size: 22px;
    color: {{ palette.text }}aa;
  }
  .label {
    font-size: 11px; color: {{ palette.accent }};
    letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;
  }
</style>
</head>
<body>
  {% if bg_image %}<img class="bg-image" src="{{ bg_image }}" alt="">{% endif %}
  <div class="blob"></div>
  <div class="blob-2"></div>
  <div class="paper"></div>
  <div class="container">
    <div class="top">
      <div>{{ badge or "inema" }} · nº {{ slide_num }}</div>
      <div class="num">— notes</div>
    </div>
    <div class="main">
      <div class="headline">{{ headline }}</div>
      <div class="underline"></div>
      {% if context %}<div class="context">{{ context }}</div>{% endif %}
      <div class="signature">— {{ handle or "@inema.tds" | replace("@", "") }}</div>
    </div>
    <div class="bottom">
      <div class="label">{{ slide_label or "EARTH · 2026" }}</div>
      <div class="handle">{{ handle or "@inema.tds" }}</div>
    </div>
  </div>
</body>
</html>
