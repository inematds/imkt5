<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: {{ width }}px; height: {{ height }}px; overflow: hidden;
    background: {{ palette.background }};
    font-family: 'Rajdhani', sans-serif;
    color: {{ palette.text }};
    position: relative;
  }
  {% if bg_image %}
  .bg-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.4) saturate(1.4) hue-rotate(-10deg);
    z-index: 0;
  }
  {% endif %}
  /* synthwave perspective grid */
  .grid {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 55%; z-index: 1;
    background:
      linear-gradient(180deg, transparent 0%, {{ palette.background }}ff 100%),
      linear-gradient(90deg, transparent 0%, transparent calc(100% - 1px), {{ palette.primary }}88 100%),
      repeating-linear-gradient(90deg,
        transparent 0, transparent calc(10% - 1px),
        {{ palette.primary }}55 calc(10% - 1px), {{ palette.primary }}55 10%),
      repeating-linear-gradient(0deg,
        transparent 0, transparent calc(16% - 1px),
        {{ palette.secondary }}55 calc(16% - 1px), {{ palette.secondary }}55 16%);
    transform: perspective(500px) rotateX(55deg);
    transform-origin: bottom;
    opacity: 0.55;
  }
  .sun {
    position: absolute;
    width: 38%; aspect-ratio: 1;
    background: radial-gradient(circle,
      {{ palette.primary }} 0%, {{ palette.secondary }}00 70%);
    top: 12%; left: 31%;
    z-index: 1; opacity: 0.7;
  }
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(135deg, {{ palette.background }}90 0%, {{ palette.background }}70 100%);
  }
  .container {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    padding: {{ pad_v }}px {{ pad_h }}px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top {
    display: flex; justify-content: space-between;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: {{ palette.primary }};
  }
  .top .right { color: {{ palette.secondary }}; }
  .main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; gap: 24px;
  }
  .headline {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: {{ (headline_size * 1.05) | int }}px;
    line-height: 1.05; letter-spacing: 0.005em;
    color: {{ palette.text }};
    text-transform: uppercase;
    max-width: 95%;
    text-shadow:
      0 0 20px {{ palette.primary }}bb,
      0 0 40px {{ palette.primary }}66;
  }
  .context {
    font-family: 'Rajdhani', sans-serif; font-weight: 500;
    font-size: {{ (headline_size * 0.32) | int }}px;
    line-height: 1.3; color: {{ palette.secondary }};
    max-width: 90%; letter-spacing: 0.03em;
  }
  .line-dot {
    display: flex; gap: 6px; align-items: center;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: {{ palette.accent }}; letter-spacing: 0.14em;
  }
  .line-dot::before {
    content: ""; display: block; width: 8px; height: 8px;
    background: {{ palette.accent }}; border-radius: 50%;
    box-shadow: 0 0 14px {{ palette.accent }};
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .handle { color: {{ palette.primary }}; text-shadow: 0 0 10px {{ palette.primary }}88; }
  .label { color: {{ palette.secondary }}; }
</style>
</head>
<body>
  {% if bg_image %}<img class="bg-image" src="{{ bg_image }}" alt="">{% endif %}
  <div class="sun"></div>
  <div class="grid"></div>
  <div class="overlay"></div>
  <div class="container">
    <div class="top">
      <div>▸ {{ badge or "INEMA" }}_SYS</div>
      <div class="right">[{{ slide_num }}]</div>
    </div>
    <div class="main">
      <div class="line-dot">SIGNAL · {{ slide_label or "FRAME " + slide_num }}</div>
      <div class="headline">{{ headline }}</div>
      {% if context %}<div class="context">{{ context }}</div>{% endif %}
    </div>
    <div class="bottom">
      <div class="label">∎ {{ slide_label or "OUTPUT" }}</div>
      <div class="handle">{{ handle or "@inema.tds" }}</div>
    </div>
  </div>
</body>
</html>
