<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,800;1,800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: {{ width }}px; height: {{ height }}px; overflow: hidden;
    background: {{ palette.background }};
    font-family: 'IBM Plex Mono', monospace;
    color: {{ palette.text }};
    position: relative;
  }
  /* noise/grain overlay via gradient repeat */
  .noise {
    position: absolute; inset: 0; z-index: 1;
    background-image:
      radial-gradient(circle at 25% 30%, {{ palette.primary }}22 0%, transparent 40%),
      radial-gradient(circle at 75% 80%, {{ palette.secondary }}22 0%, transparent 45%);
    pointer-events: none;
  }
  .shape {
    position: absolute; z-index: 2;
    width: 72%; height: 28%;
    background: {{ palette.accent }};
    top: 34%; left: -8%;
    transform: rotate(-6deg);
    box-shadow: 0 18px 0 {{ palette.background }};
  }
  .shape-2 {
    position: absolute; z-index: 2;
    width: 32%; height: 32%;
    background: {{ palette.primary }};
    border-radius: 50%;
    top: 8%; right: -8%;
    opacity: 0.92;
  }
  .container {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    padding: {{ pad_v }}px {{ pad_h }}px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .stamp {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700;
    font-size: 14px; letter-spacing: 0.14em;
    background: {{ palette.text }};
    color: {{ palette.background }};
    padding: 6px 12px; text-transform: uppercase;
    transform: rotate(-2deg);
  }
  .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px; color: {{ palette.text }};
    letter-spacing: 0.02em;
  }
  .main {
    flex: 1; display: flex; align-items: center;
  }
  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: {{ (headline_size * 1.7) | int }}px;
    line-height: 0.88; letter-spacing: 0.005em;
    color: {{ palette.text }};
    text-transform: uppercase;
    max-width: 100%;
    text-shadow: 6px 6px 0 {{ palette.primary }};
    word-break: break-word;
  }
  .context {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-style: italic;
    font-size: {{ (headline_size * 0.38) | int }}px;
    line-height: 1.08; text-transform: uppercase;
    color: {{ palette.text }};
    margin-top: 24px; max-width: 90%;
    letter-spacing: 0.02em;
  }
  .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .label {
    background: {{ palette.text }}; color: {{ palette.background }};
    padding: 4px 10px; font-weight: 700;
  }
  .handle {
    color: {{ palette.text }}cc;
  }
</style>
</head>
<body>
  <div class="noise"></div>
  <div class="shape-2"></div>
  <div class="shape"></div>
  <div class="container">
    <div class="top">
      <div class="stamp">{{ badge or "INEMA" }} / {{ slide_num }}</div>
      <div class="num">№{{ slide_num }}</div>
    </div>
    <div class="main">
      <div>
        <div class="headline">{{ headline }}</div>
        {% if context %}<div class="context">› {{ context }}</div>{% endif %}
      </div>
    </div>
    <div class="bottom">
      <div class="label">{{ slide_label or "POP · 2026" }}</div>
      <div class="handle">{{ handle or "@inema.tds" }}</div>
    </div>
  </div>
</body>
</html>
