<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: {{ width }}px; height: {{ height }}px;
    overflow: hidden; background: rgba(0,0,0,0);
    font-family: 'Archivo Black', sans-serif;
    position: relative;
  }
  /* Stamp style — rotated, double-border, high contrast (c79 may-shorts-19 "NO BUSINESS NEEDS THIS") */
  .stamp-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    text-align: center;
  }
  .stamp {
    display: inline-block;
    padding: 28px 48px;
    border: 4px solid {{ stamp_color | default('#F09025') }};
    border-radius: 8px;
    background: rgba(8,12,18,0.85);
    box-shadow:
      0 0 0 2px rgba(0,0,0,0.5),
      0 20px 50px rgba(0,0,0,0.7);
  }
  .stamp-text {
    font-family: 'Archivo Black', 'Bebas Neue', sans-serif;
    font-weight: 900;
    font-size: {{ (font_size * 0.90) | int }}px;
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: {{ stamp_color | default('#F09025') }};
    text-transform: uppercase;
    max-width: {{ max_text_width }}px;
    text-shadow: 0 0 20px {{ stamp_glow | default('rgba(240,144,37,0.55)') }};
  }
</style>
</head>
<body>
  <div class="stamp-wrap">
    <div class="stamp">
      <div class="stamp-text">{{ text_overlay }}</div>
    </div>
  </div>
</body>
</html>
