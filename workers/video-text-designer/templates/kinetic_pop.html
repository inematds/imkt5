<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: {{ width }}px; height: {{ height }}px;
    overflow: hidden; background: rgba(0,0,0,0);
    font-family: 'Inter', sans-serif; position: relative;
  }
  /* Kinetic Pop — sans condensed huge with neon glow */
  .stage {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    {% if text_position == 'center' %}
    justify-content: center;
    {% elif text_position == 'bottom' %}
    justify-content: flex-end;
    padding-bottom: {{ safe_bottom }}px;
    {% else %}
    justify-content: flex-start;
    padding-top: {{ safe_top }}px;
    {% endif %}
    align-items: center;
    padding-left: {{ pad_h }}px;
    padding-right: {{ pad_h }}px;
  }
  .kinetic {
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-weight: 900;
    font-size: {{ (font_size * 1.6) | int }}px;
    line-height: 0.92;
    letter-spacing: 0.02em;
    color: {{ pop_color | default('#00E5FF') }};
    text-transform: uppercase;
    text-align: center;
    max-width: {{ max_text_width }}px;
    text-shadow:
      0 0 8px {{ pop_glow1 | default('rgba(0,229,255,0.85)') }},
      0 0 24px {{ pop_glow2 | default('rgba(0,229,255,0.55)') }},
      0 0 48px {{ pop_glow3 | default('rgba(0,229,255,0.35)') }},
      0 4px 16px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="kinetic">{{ text_overlay }}</div>
  </div>
</body>
</html>
