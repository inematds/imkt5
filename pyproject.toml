[project]
name = "imkt4"
version = "0.0.1"
description = "Plataforma modular multi-tenant para pipelines de mídia, com entrada conversacional (Telegram, WhatsApp, Web) e fila de jobs."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "aiosqlite>=0.20.0",
    "claude-agent-sdk>=0.1.60",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "litellm>=1.40.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "rich>=13.0",
    "rq>=1.16",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
imkt4 = "imkt4.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imkt4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
